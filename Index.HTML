<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla de bienvenida -->
    <div class="intro">
        <h1>💌 Maiky te ha enviado una carta 💌</h1>
        <button id="openCard" class="btn">Ver carta</button>
    </div>

    <!-- Pregunta de San Valentín -->
    <div class="container hidden">
        <h1 class="fade-in">¿Quieres ser mi San Valentín? 💕</h1>
        <div class="buttons">
            <button id="yes" class="btn">Sí 💘</button>
            <button id="no" class="btn">No 💔</button>
        </div>
    </div>

    <!-- Mensaje de agradecimiento -->
    <div class="message hidden">
        <h2>💖 ¡Gracias por ser mi San Valentín! 💖</h2>
        <p>🌹 Sabía que no dirías que no (": Te amo con toda mi alma y espero que seas mi San Valentín por el resto de mi vida. 🌹</p>
        <div class="flowers">🌹🌹🌹🌹🌹🌹🌹</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
